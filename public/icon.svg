<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262b"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#837fff"/>
      <stop offset="1" stop-color="#6f6bff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#card)" stroke="#34343b" stroke-width="2"/>

  <!-- film sprocket holes -->
  <g fill="#2d2d33">
    <rect x="34" y="70" width="16" height="18" rx="4"/>
    <rect x="34" y="119" width="16" height="18" rx="4"/>
    <rect x="34" y="168" width="16" height="18" rx="4"/>
    <rect x="206" y="70" width="16" height="18" rx="4"/>
    <rect x="206" y="119" width="16" height="18" rx="4"/>
    <rect x="206" y="168" width="16" height="18" rx="4"/>
  </g>

  <!-- play triangle -->
  <path d="M104 84 L104 172 L178 128 Z" fill="url(#play)" filter="url(#glow)" stroke="#a5a2ff" stroke-width="2" stroke-linejoin="round"/>
</svg>
