# electron-builder config. appId + productName are PINNED FOREVER: changing
# either moves the userData dir and orphans the user's IndexedDB (saved
# projects). The app:// origin host in electron/main.ts is pinned for the same
# reason. Per-user NSIS install → no admin prompt, works unsigned.
appId: com.olpremiere.desktop
productName: OL Premiere
directories:
  output: release/${version}
  buildResources: build
# Lean asar: only the built output + package.json. The renderer is fully bundled
# by Vite into out/renderer, and the main process externalizes only electron +
# node builtins (runtime-provided), so no node_modules ship.
files:
  - out/**/*
  - package.json
asar: true
# The bundled ffmpeg ships OUTSIDE app.asar (you cannot spawn an exe from a
# virtual asar path). Resolved at runtime via process.resourcesPath/ffmpeg.
extraResources:
  - from: vendor/ffmpeg/win-x64/ffmpeg.exe
    to: ffmpeg/ffmpeg.exe
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Hyphenated (no spaces) so the local file, the GitHub asset, and latest.yml
  # all reference the EXACT same name, so no sanitization mismatch can break updates.
  artifactName: OL-Premiere-${version}-setup.${ext}
# Auto-update feed: GitHub Releases. electron-updater checks the latest published
# release of dluxpixel/olpremiere.
#
# `owner`/`repo` here are the ONE source of truth for where the feed lives, and
# scripts/publish.mjs must agree with them: the updater reads the feed from this
# repo, so a publisher pointing anywhere else uploads a release nothing ever
# looks at. That is a "successful" publish into the void, which is the worst kind of
# failure because nothing errors.
#
# Changing them also strands existing installs: a build already in the wild keeps
# polling the feed it was compiled with, so it can never auto-update onto a new
# one and has to be replaced by hand exactly once.
# releaseType 'draft' uploads all assets reliably (no pre-existing-tag 422); the
# release script (scripts/release.mjs) then flips it to published, which mints the
# tag and makes it the 'latest' the updater sees.
publish:
  provider: github
  owner: dluxpixel
  repo: olpremiere
  releaseType: draft
